  file:// 下的 ESM import 会被 CORS 拦截，因此渲染逻辑与样式为
  index.mjs / styles.css 的逐字内嵌副本（契约允许合理重复，见下方注释）；
  修改渲染行为/样式时必须同步对应源文件。
-->
<html lang="zh-CN">

<body>
  <h1>ViewViewView · preview.html</h1>
  <p class="meta">
    模拟载荷 state / delay / pulse / reply / errcode · total 942 · window 34 ·
    counts: PASS 890 / FAIL 40 / TIMEOUT 12
  </p>
  <button id="vvv-push" type="button">模拟一次推送（change:payload）</button>
  <div id="vvv-preview"></div>

  <!-- ▼ styles.css 的逐字内嵌副本；源头：src/viewviewview/static/styles.css -->
  <script type="text/plain" id="vvv-css-src">
/*
 * ViewViewView dual-pane widget styles — ARCHITECTURE.md §4.4.
 *
 * anywidget injects this file into the widget shadow root, so palette tokens
 * are declared on `:host` to stay isolated to this component, and every
 * visible element carries a `.vvv-` class prefix.
 *
 * Palette: Deephaven dark-tone approximation — near-black surfaces, soft
 * off-white foreground, blue accent, low saturation overall (decision D5).
 * Hex values follow §4.4 verbatim (allowed micro-tuning was not needed).
 */

:host {
  --vvv-bg: #1c2126;
  --vvv-panel: #232931;
  --vvv-header: #2b323a;
  --vvv-row-alt: #20252b;
  --vvv-fg: #ffffff;
  --vvv-fg-dim: #8b95a1;
  --vvv-accent: #3d6fe0;
  --vvv-border: #333b45;
  --vvv-live: #2ea043;
  --vvv-count: #39ff14;

  background: var(--vvv-bg);
  box-sizing: border-box;
  color: var(--vvv-fg);
  display: block;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
    Arial, "Microsoft YaHei", sans-serif;
  font-size: 13px;
  height: 100%;
  line-height: 1.45;
  max-height: 640px;
  min-height: 320px;
  scrollbar-color: var(--vvv-border) transparent;
  scrollbar-width: thin;
}

/* Two-pane layout: counts pane ≈150px caps, detail pane fills the remainder. */
.vvv-root {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 10px;
  height: 100%;
  max-height: 640px;
  min-height: 320px;
  padding: 10px 12px;
}

.vvv-pane {
  background: var(--vvv-panel);
  border: 1px solid var(--vvv-border);
  border-radius: 8px;
  box-sizing: border-box;
  overflow: auto;
}

.vvv-pane--counts {
  flex: 0 0 auto;
  max-height: 150px;
}

/* min-height:0 lets the inner table scroll inside the flexible pane. */
.vvv-pane--detail {
  flex: 1 1 auto;
  min-height: 0;
}

.vvv-table {
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
  width: 100%;
}

/* Sticky header pinned to the pane's own scrollport. */
.vvv-th {
  background: var(--vvv-header);
  border-bottom: 1px solid var(--vvv-border);
  color: var(--vvv-fg);
  font-weight: 600;
  padding: 6px 12px;
  position: sticky;
  text-align: left;
  top: 0;
  white-space: nowrap;
  z-index: 1;
}

.vvv-th--num {
  text-align: right;
}

.vvv-td {
  border-bottom: 1px solid var(--vvv-border);
  color: var(--vvv-fg);
  max-width: 480px;
  overflow: hidden;
  padding: 4px 12px;
  text-align: left;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.vvv-td--num {
  text-align: right;
}

/* Top-pane count values: neon green on dark, per the FaultViz look. */
.vvv-count {
  color: var(--vvv-count);
  font-weight: 600;
  text-shadow: 0 0 6px rgba(57, 255, 20, 0.25);
}

/* Zebra rows; hover highlights with the header tone. */
.vvv-table tbody tr:nth-child(even) {
  background: var(--vvv-row-alt);
}

.vvv-table tbody tr:hover {
  background: var(--vvv-header);
}

/* Graceful empty states ("No data recorded." / "No state column"). */
.vvv-note {
  color: var(--vvv-fg-dim);
  font-size: 12px;
  padding: 12px 14px;
}

/* Bottom-right small caption: 已记录 n 行 / 当前窗口 m 行 / live. */
.vvv-footer {
  align-items: center;
  color: var(--vvv-fg-dim);
  display: flex;
  flex: 0 0 auto;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  gap: 10px;
  justify-content: flex-end;
  padding: 0 2px;
}

.vvv-live {
  align-items: center;
  color: var(--vvv-live);
  display: inline-flex;
  gap: 4px;
}

.vvv-live::before {
  background: var(--vvv-live);
  border-radius: 50%;
  content: "";
  display: inline-block;
  height: 6px;
  width: 6px;
}
  </script>

  <!--
    ▼ 渲染逻辑复制自 src/viewviewview/static/index.mjs（允许复制：file:// 下
    无法 import 外部模块，需要零依赖打开即见效）；修改渲染行为需同步 index.mjs。
    仅引入 default export render 与其内部依赖的 helper（逐字复制）。
  -->
  <script type="module">
/* ===== COPY OF src/viewviewview/static/index.mjs (render + helpers) ===== */

/**
 * Default anywidget entry point: render the current payload snapshot and keep
 * the DOM in sync with subsequent `change:payload` / `change:theme` pushes.
 * All rendering is a bounded full redraw (<=200 rows) via DocumentFragment.
 *
 * @param {{
 *   get: (key: string) => unknown,
 *   on: (name: string, callback: () => void) => void,
 *   off?: (name: string, callback: () => void) => void,
 * }} model
 * @param {HTMLElement} el Shadow-DOM element owned by anywidget.
 * @returns {() => void} Teardown function, called by anywidget on view removal.
 */
function render({ model, el }) {
  const root = document.createElement("div");
  root.className = "vvv-root";
  applyTheme(root, model.get("theme"));
  el.appendChild(root);
  renderPayload(root, model.get("payload"));

  const onPayloadChange = () => renderPayload(root, model.get("payload"));
  const onThemeChange = () => applyTheme(root, model.get("theme"));
  model.on("change:payload", onPayloadChange);
  model.on("change:theme", onThemeChange);

  return () => {
    if (typeof model.off === "function") {
      model.off("change:payload", onPayloadChange);
      model.off("change:theme", onThemeChange);
    }
  };
}

/**
 * Rebuild the two panes from one §4.3 payload snapshot. The payload may be
 * absent/partial while the widget is being wired, so every access is defensive.
 * @param {HTMLElement} root
 * @param {unknown} payload
 * @returns {void}
 */
function renderPayload(root, payload) {
  clearChildren(root);
  const columns = readColumns(payload);
  const counts = readCounts(payload);
  const rows = readRows(payload);
  const hasCounts = Object.keys(counts).length > 0;
  if (columns.length === 0 && rows.length === 0 && !hasCounts) {
    root.appendChild(buildNote("No data recorded."));
    return;
  }

  const stateKey = readStateKey(payload);
  root.appendChild(buildCountsPane(stateKey, counts));

  // §3.2 limit=0 → counts-only payload (no detail pane); rows arrive
  // newest-first already (§4.3), so render them in array order as-is.
  // Declared columns render even before the first record (empty tbody).
  if (columns.length > 0) {
    root.appendChild(buildDetailPane(columns, rows));
  }

  root.appendChild(buildFooter(payload, rows));
}

/** @returns {{ name: string, type: string }[]} User columns of the payload. */
function readColumns(payload) {
  if (!isPayloadObject(payload) || !Array.isArray(payload.columns)) {
    return [];
  }
  return payload.columns.filter(
    (column) =>
      column !== null &&
      typeof column === "object" &&
      typeof column.name === "string",
  );
}

/** @returns {Record<string, unknown>} The counts dict of the payload. */
function readCounts(payload) {
  return isPayloadObject(payload) && isPayloadObject(payload.counts)
    ? payload.counts
    : {};
}

/** @returns {unknown[][]} The rows array of the payload. */
function readRows(payload) {
  return isPayloadObject(payload) && Array.isArray(payload.rows)
    ? payload.rows
    : [];
}

/** @returns {string | null} The state column name, or null when absent. */
function readStateKey(payload) {
  return isPayloadObject(payload) && typeof payload.state_key === "string"
    ? payload.state_key
    : null;
}

/**
 * Top pane: category statistics. No state column → graceful empty state.
 * @param {string | null} stateKey
 * @param {Record<string, unknown>} counts
 * @returns {HTMLElement}
 */
function buildCountsPane(stateKey, counts) {
  const pane = document.createElement("section");
  pane.className = "vvv-pane vvv-pane--counts";
  if (stateKey === null) {
    pane.appendChild(buildNote("No state column"));
  } else {
    pane.appendChild(buildCountsTable(stateKey, counts));
  }
  return pane;
}

/**
 * Top pane table: one row per state bucket, header `[state_key | count]`.
 * Bucket order = payload dict order (no re-sorting; see OPEN_QUESTIONS B2).
 */
function buildCountsTable(stateKey, counts) {
  const table = document.createElement("table");
  table.className = "vvv-table vvv-table--counts";
  table.appendChild(buildTableHead([stateKey, "count"], [false, true]));
  const tbody = document.createElement("tbody");
  for (const [bucket, count] of Object.entries(counts)) {
    const tr = document.createElement("tr");
    const nameCell = document.createElement("td");
    nameCell.className = "vvv-td";
    const countCell = document.createElement("td");
    countCell.className = "vvv-td vvv-td--num vvv-count";
    nameCell.textContent = toDisplayText(bucket);
    countCell.textContent = toDisplayText(count);
    tr.appendChild(nameCell);
    tr.appendChild(countCell);
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  return table;
}

/**
 * Bottom pane table: schema columns in payload order, rows newest-first.
 * @returns {HTMLElement}
 */
function buildDetailPane(columns, rows) {
  const pane = document.createElement("section");
  pane.className = "vvv-pane vvv-pane--detail";
  pane.appendChild(buildDetailTable(columns, rows));
  return pane;
}

/** Header cells `int|float` → right-aligned, `str` → left-aligned. */
function buildDetailTable(columns, rows) {
  const table = document.createElement("table");
  table.className = "vvv-table vvv-table--detail";
  table.appendChild(
    buildTableHead(
      columns.map((column) => column.name),
      columns.map((column) => isNumericType(column.type)),
    ),
  );
  const tbody = document.createElement("tbody");
  for (const row of rows) {
    const values = Array.isArray(row) ? row : [];
    const tr = document.createElement("tr");
    columns.forEach((column, index) => {
      const td = document.createElement("td");
      td.className = "vvv-td" + (isNumericType(column.type) ? " vvv-td--num" : "");
      td.textContent = toDisplayText(values[index]);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  return table;
}

/** @returns {HTMLElement} Sticky table head for `labels`. */
function buildTableHead(labels, numeric) {
  const thead = document.createElement("thead");
  const tr = document.createElement("tr");
  labels.forEach((label, index) => {
    const th = document.createElement("th");
    th.className = "vvv-th" + (numeric[index] ? " vvv-th--num" : "");
    th.textContent = toDisplayText(label);
    th.setAttribute("scope", "col");
    tr.appendChild(th);
  });
  thead.appendChild(tr);
  return thead;
}

/** Footer caption, bottom-right small dim text with a green "live" mark. */
function buildFooter(payload, rows) {
  const footer = document.createElement("div");
  footer.className = "vvv-footer";
  const safe = isPayloadObject(payload) ? payload : {};
  const total = toCount(safe.total, "0");
  const windowSize = toCount(safe.window, String(rows.length));
  const label = document.createElement("span");
  label.textContent = `已记录 ${total} 行 / 当前窗口 ${windowSize} 行`;
  const live = document.createElement("span");
  live.className = "vvv-live";
  live.textContent = "live";
  footer.appendChild(label);
  footer.appendChild(live);
  return footer;
}

/** @returns {HTMLElement} Dim text note (graceful empty states). */
function buildNote(text) {
  const note = document.createElement("div");
  note.className = "vvv-note";
  note.textContent = text;
  return note;
}

/**
 * Theme lives on a data attribute for future palettes; CSS tokens (§4.4) are
 * dark-only for now, so any non-"dark" value still renders dark (B1).
 */
function applyTheme(root, theme) {
  const value = typeof theme === "string" && theme !== "" ? theme : "dark";
  root.setAttribute("data-vvv-theme", value);
}

/** @returns {boolean} True when the column type is numeric (right-aligned). */
function isNumericType(type) {
  return type === "int" || type === "float";
}

/** @returns {string} Text for a cell; null/undefined must show as "". */
function toDisplayText(value) {
  return value === null || value === undefined ? "" : String(value);
}

/** @returns {string} Number as text with a fallback for missing fields. */
function toCount(value, fallback) {
  return typeof value === "number" && Number.isFinite(value)
    ? String(value)
    : fallback;
}

/** @returns {boolean} True for non-array JSON objects. */
function isPayloadObject(value) {
  return value !== null && typeof value === "object" && !Array.isArray(value);
}

/** @returns {void} */
function clearChildren(node) {
  while (node.firstChild) {
    node.removeChild(node.firstChild);
  }
}

/* ================= END COPY OF index.mjs ================= */

/* ---- preview-only bootstrap（不属于 index.mjs；模拟 anywidget 环境） ---- */

// 模拟载荷（§4.3）：state/delay/pulse/reply/errcode，34 行（最新在前）。
// rows 仅最近窗口（34 行），counts 为本实例全量计数（890/40/12 → total 942），
// 二者不需逐一对上。第 6 行 reply 为 null，演示“null → 空串”。
const initialPayload = {
  columns: [
    { name: "state", type: "str" },
    { name: "delay", type: "int" },
    { name: "pulse", type: "float" },
    { name: "reply", type: "str" },
    { name: "errcode", type: "int" },
  ],
  state_key: "state",
  counts: { PASS: 890, FAIL: 40, TIMEOUT: 12 },
  rows: [
    ["PASS", 176, 12.5, "ok", 0],
    ["FAIL", 191, 13.1, "no-reply", 3],
    ["PASS", 164, 12.0, "ok", 0],
    ["TIMEOUT", 159, 11.8, "open", 7],
    ["PASS", 182, 12.7, "ok", 0],
    ["PASS", 171, 12.2, null, 0],
    ["FAIL", 168, 12.4, "short", 2],
    ["PASS", 177, 12.6, "ok", 0],
    ["PASS", 163, 11.9, "ok", 0],
    ["TIMEOUT", 155, 11.6, "open", 7],
    ["PASS", 189, 13.0, "ok", 0],
    ["PASS", 172, 12.3, "ok", 0],
    ["PASS", 166, 12.1, "ok", 0],
    ["FAIL", 184, 12.9, "no-reply", 1],
    ["PASS", 158, 11.7, "ok", 0],
    ["PASS", 175, 12.5, "ok", 0],
    ["PASS", 169, 12.2, "ok", 0],
    ["TIMEOUT", 161, 11.9, "open", 7],
    ["PASS", 188, 12.9, "ok", 0],
    ["PASS", 174, 12.4, "ok", 0],
    ["PASS", 167, 12.1, "ok", 0],
    ["FAIL", 193, 13.2, "short", 4],
    ["PASS", 173, 12.4, "ok", 0],
    ["PASS", 162, 11.8, "ok", 0],
    ["PASS", 179, 12.7, "ok", 0],
    ["PASS", 170, 12.3, "ok", 0],
    ["TIMEOUT", 160, 11.8, "open", 7],
    ["PASS", 186, 12.8, "ok", 0],
    ["PASS", 165, 12.0, "ok", 0],
    ["PASS", 178, 12.6, "ok", 0],
    ["FAIL", 192, 13.1, "no-reply", 3],
    ["PASS", 160, 11.8, "ok", 0],
    ["PASS", 173, 12.3, "ok", 0],
    ["PASS", 185, 12.7, "ok", 0],
  ],
  total: 942,
  window: 34,
  version: 1042,
};

// Shadow DOM 启动：复刻 anywidget（含 _css 时）的挂载方式。
const host = document.getElementById("vvv-preview");
const shadow = host.attachShadow({ mode: "open" });
const styleElement = document.createElement("style");
styleElement.textContent = document.getElementById("vvv-css-src").textContent;
shadow.appendChild(styleElement);
const el = document.createElement("div");
el.style.height = "100%";
shadow.appendChild(el);

// 最小 mock model：get/on/off 语义与 ipywidgets Model 对齐。
let currentPayload = initialPayload;
const payloadListeners = [];
function mockModel() {
  return {
    get: (key) =>
      key === "payload" ? currentPayload : key === "theme" ? "dark" : undefined,
    on: (event, callback) => {
      if (event === "change:payload") {
        payloadListeners.push(callback);
      }
    },
    off: (event, callback) => {
      if (event === "change:payload") {
        const index = payloadListeners.indexOf(callback);
        if (index !== -1) {
          payloadListeners.splice(index, 1);
        }
      }
    },
  };
}

render({ model: mockModel(), el });

// 按 Syncer 合帧语义模拟增量快照：total/counts/version 递增，新行插入队首，
// 窗口深度自 34 起保持（环形窗口）。
let demoRowSeed = 942;
document.getElementById("vvv-push").addEventListener("click", () => {
  demoRowSeed += 1;
  currentPayload = {
    ...currentPayload,
    counts: {
      ...currentPayload.counts,
      PASS: currentPayload.counts.PASS + 1,
    },
    rows: [
      ["PASS", 150 + (demoRowSeed % 50), +(11.5 + (demoRowSeed % 20) / 10).toFixed(1), "ok", 0],
      ...currentPayload.rows.slice(0, 33),
    ],
    total: demoRowSeed,
    version: currentPayload.version + 7,
  };
  payloadListeners.forEach((listener) => listener());
});
  </script>
</body>
</html>
